<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>SMK Lundu Annual Dinner – Lucky Draw</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root{--pink:#ff2bd6;--cyan:#27f3ff;--yellow:#fff200;--dark:#0b0221;--green:#39ff14;--red:#ff1a5c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none}
html,body{margin:0;height:100%;background:var(--dark);color:#fff;overflow:hidden;
  font-family:'Press Start 2P',ui-monospace,Menlo,Consolas,monospace}

/* ---------- background ---------- */
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;
  background:linear-gradient(#0b0221 0%,#2b0a52 45%,#7a1b8f 62%,#ff2bd6 64%,#0b0221 64.5%)}
.sun{position:absolute;left:50%;top:20%;width:min(50vw,50vh);aspect-ratio:1;transform:translateX(-50%);border-radius:50%;
  background:linear-gradient(#fff200,#ff7a18 45%,#ff2bd6);box-shadow:0 0 80px #ff2bd699;opacity:.45;
  -webkit-mask:repeating-linear-gradient(#000 0 8%,transparent 8% 10%);mask:repeating-linear-gradient(#000 0 8%,transparent 8% 10%)}
.floor{position:absolute;left:-50%;width:200%;top:64%;bottom:-20%;transform:perspective(380px) rotateX(62deg);transform-origin:top;
  background:repeating-linear-gradient(90deg,var(--cyan) 0 2px,transparent 2px 70px),repeating-linear-gradient(0deg,var(--cyan) 0 2px,transparent 2px 70px);
  opacity:.4;animation:grid 1.2s linear infinite}
@keyframes grid{to{background-position:0 70px,0 70px}}
.stars{position:absolute;inset:0 0 40% 0;
  background-image:radial-gradient(2px 2px at 20px 30px,#fff,transparent),radial-gradient(2px 2px at 140px 90px,#27f3ff,transparent),
  radial-gradient(1px 1px at 80px 160px,#fff,transparent),radial-gradient(2px 2px at 220px 60px,#ff2bd6,transparent);
  background-size:260px 200px;animation:tw 3s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.4}to{opacity:1}}
.scan{position:fixed;inset:0;z-index:90;pointer-events:none;
  background:repeating-linear-gradient(transparent 0 2px,rgba(0,0,0,.18) 2px 4px);box-shadow:inset 0 0 160px rgba(0,0,0,.7)}

/* ---------- layout ---------- */
main{position:relative;z-index:2;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;padding:1.2vh 2.5vw 1.4vh;gap:.6vh}
h1{margin:0;text-align:center;font-size:clamp(13px,2.9vw,34px);line-height:1.2;letter-spacing:.05em;
  text-shadow:0 0 6px #fff,0 0 14px var(--pink),0 0 30px var(--pink),0 0 60px var(--pink);animation:flick 4s infinite}
h1 span{color:var(--cyan);text-shadow:0 0 6px #fff,0 0 14px var(--cyan),0 0 30px var(--cyan),0 0 60px var(--cyan)}
@keyframes flick{0%,92%,96%,100%{opacity:1}93%{opacity:.6}95%{opacity:.85}}
.sub{font-size:clamp(7px,1.1vw,13px);color:var(--yellow);text-shadow:0 0 10px var(--yellow);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}

.cabinet{flex:1;min-height:0;width:100%;max-width:1400px;display:flex;gap:1.6vw;align-items:stretch;margin-top:.6vh}

/* machine body */
.machine{flex:1;min-width:0;display:flex;flex-direction:column;gap:1.2vh;padding:1.2vh 1.8vw 1.6vh;
  border:6px solid var(--pink);border-radius:24px;
  background:linear-gradient(#41107f,#1a0646);
  box-shadow:0 0 40px var(--pink),inset 0 0 40px rgba(255,43,214,.35)}
.machine.jackpot{animation:jp .3s steps(2) infinite}
@keyframes jp{50%{border-color:var(--yellow);box-shadow:0 0 70px var(--yellow),inset 0 0 50px rgba(255,242,0,.5)}}

.marquee{display:flex;flex-direction:column;align-items:center;gap:.7vh}
.mq{font-size:clamp(12px,2.3vw,28px);color:var(--yellow);text-shadow:0 0 8px var(--yellow),0 0 24px #ff7a18;letter-spacing:.1em}
.bulbs{display:flex;justify-content:space-between;width:100%}
.bulbs span{width:1.3vh;height:1.3vh;border-radius:50%;background:var(--yellow);box-shadow:0 0 8px var(--yellow);animation:bulb .8s steps(1) infinite}
.bulbs span:nth-child(odd){animation-delay:.4s}
@keyframes bulb{0%{background:var(--yellow);box-shadow:0 0 8px var(--yellow)}50%{background:#7a2a8a;box-shadow:none}}
.machine.spinning .bulbs span,.machine.jackpot .bulbs span{animation-duration:.22s}

/* reels */
.symrow{display:flex;justify-content:center;gap:1.8vw;height:18vh;flex:0 0 auto}
.symwrap{position:relative;width:22vh}
.namewrap{position:relative;flex:1;min-height:0;margin:0 3.2vw}
.reelwin{position:absolute;inset:0;overflow:hidden;border-radius:12px;background:#05010f;border:5px solid #b9b3d9;
  box-shadow:inset 0 0 30px #000,0 0 20px #27f3ff66}
.reelwin::before{content:'';position:absolute;inset:0;z-index:3;pointer-events:none;
  background:linear-gradient(rgba(0,0,0,.85) 0,rgba(0,0,0,.2) 30%,transparent 33%,transparent 67%,rgba(0,0,0,.2) 70%,rgba(0,0,0,.85) 100%)}
.reelwin::after{content:'';position:absolute;left:0;right:0;top:33.333%;height:33.334%;z-index:4;pointer-events:none;
  border-top:3px solid var(--red);border-bottom:3px solid var(--red);box-shadow:0 0 14px var(--red),inset 0 0 14px rgba(255,26,92,.35)}
.glass{position:absolute;inset:0;z-index:5;pointer-events:none;border-radius:8px;
  background:linear-gradient(115deg,rgba(255,255,255,.14) 0,rgba(255,255,255,0) 35%)}
.strip{position:absolute;left:0;right:0;top:0;will-change:transform}
.cell{height:var(--rh,60px);display:flex;align-items:center;justify-content:center;white-space:nowrap;
  font-family:'VT323',monospace;color:var(--green);text-shadow:0 0 10px var(--green),0 0 24px var(--green);line-height:1}
.cell.sym{font-family:'Press Start 2P',monospace;text-shadow:none}
.cell.seven{color:var(--red);font-family:'Press Start 2P',monospace;text-shadow:0 0 12px var(--red),0 0 28px var(--red)}
.cell.bar{color:var(--cyan);text-shadow:0 0 10px var(--cyan)}
.cell.winner{color:var(--yellow);text-shadow:0 0 12px var(--yellow),0 0 40px #ff7a18;animation:flash .3s steps(2) infinite}
@keyframes flash{50%{color:#fff}}
.arrow{position:absolute;top:50%;transform:translateY(-50%);font-size:clamp(14px,2.6vw,32px);color:var(--red);text-shadow:0 0 12px var(--red);animation:blink .7s steps(2) infinite}
.arrow.l{left:-2.6vw}.arrow.r{right:-2.6vw}

.lcd{background:#021a06;border:3px solid var(--green);border-radius:8px;color:var(--green);text-align:center;padding:1.2vh .6vw;
  font-size:clamp(8px,1.25vw,15px);box-shadow:inset 0 0 14px #39ff1455;text-shadow:0 0 8px var(--green)}

.btn{font-family:inherit;cursor:pointer;border:0;color:#fff;text-transform:uppercase;letter-spacing:.06em}
#start{padding:2.2vh 1vw;font-size:clamp(13px,2.2vw,26px);border-radius:14px;background:linear-gradient(#ff5be8,#c4009e);border:4px solid #fff;
  box-shadow:0 7px 0 #7a005f,0 0 26px var(--pink),0 0 50px var(--pink);animation:pulse 1.2s ease-in-out infinite;text-shadow:0 0 8px #fff}
#start:active{transform:translateY(7px);box-shadow:0 0 0 #7a005f,0 0 26px var(--pink)}
#start:disabled{filter:grayscale(.9) brightness(.6);animation:none}
@keyframes pulse{50%{transform:scale(1.02);box-shadow:0 7px 0 #7a005f,0 0 40px var(--pink),0 0 90px var(--pink)}}

/* lever */
.lever{width:min(7vw,90px);align-self:center;height:40vh;position:relative;cursor:pointer;display:flex;justify-content:center;flex:0 0 auto}
.rail{position:absolute;top:5%;bottom:11%;width:18px;border-radius:9px;background:#05010f;border:3px solid #b9b3d9;box-shadow:inset 0 0 8px #000,0 0 12px #27f3ff55}
.ball{position:absolute;top:2%;left:50%;width:min(7vw,64px);aspect-ratio:1;margin-left:calc(min(7vw,64px) / -2);border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#ff9aa8,#e0002a 55%,#7a0016);box-shadow:0 0 22px var(--red);border:3px solid #fff}
.lever.pull .ball{animation:pull 1s ease-in-out}
@keyframes pull{0%{top:2%}40%{top:calc(88% - min(7vw,64px))}100%{top:2%}}
.pulltxt{position:absolute;bottom:0;font-size:clamp(7px,1vw,12px);color:var(--yellow);text-shadow:0 0 8px var(--yellow);animation:blink 1s steps(2) infinite}

/* side panel */
aside{width:min(290px,24vw);display:flex;flex-direction:column;gap:1.3vh;min-height:0;justify-content:center;flex:0 0 auto}
.panel{border:4px solid var(--pink);border-radius:12px;background:rgba(11,2,33,.88);box-shadow:0 0 20px var(--pink);padding:1.2vh 1vw}
.panel h2{margin:0 0 .8vh;font-size:clamp(7px,1.05vw,12px);color:var(--cyan);text-shadow:0 0 8px var(--cyan);text-align:center}
.count{font-family:'VT323',monospace;font-size:clamp(30px,4vw,52px);text-align:center;color:var(--yellow);text-shadow:0 0 10px var(--yellow);line-height:1}
.hof{min-height:0;display:flex;flex-direction:column;max-height:32vh}
#list{flex:1;overflow:auto;margin:0;padding:0;list-style:none;font-family:'VT323',monospace;font-size:clamp(18px,2vw,26px);line-height:1.1}
#list li{display:flex;gap:.6em;color:var(--green);text-shadow:0 0 6px var(--green)}
#list li b{color:var(--pink);font-weight:400;min-width:2.2em}
#list:empty::before{content:"NO WINNERS YET";color:#8a7fb0}
.tools{display:flex;gap:.8vw;justify-content:center;flex-wrap:wrap}
.tool{font-size:clamp(7px,1vw,12px);padding:1.2vh 1vw;border:3px solid var(--cyan);background:rgba(11,2,33,.9);border-radius:10px;color:var(--cyan);box-shadow:0 0 12px #27f3ff88}
.tool:active{background:var(--cyan);color:#000}
.sync{font-size:clamp(6px,.85vw,10px);text-align:center;color:var(--green);text-shadow:0 0 6px var(--green);cursor:pointer;line-height:1.6}
.sync.bad{color:var(--red);text-shadow:0 0 8px var(--red);animation:blink 1s steps(2) infinite}

/* ---------- winner overlay ---------- */
#win{position:fixed;inset:0;z-index:70;display:none;flex-direction:column;align-items:center;justify-content:center;gap:3vh;padding:4vw;text-align:center;
  background:radial-gradient(circle,rgba(70,0,110,.93),rgba(5,0,15,.97))}
#win.open{display:flex}
#win .t{font-size:clamp(14px,3vw,36px);color:var(--yellow);text-shadow:0 0 14px var(--yellow);animation:blink .6s steps(2) infinite}
#win .n{font-family:'VT323',monospace;font-size:clamp(70px,17vw,240px);line-height:.95;color:var(--yellow);word-break:break-word;
  text-shadow:0 0 12px var(--yellow),0 0 40px #ff7a18,0 0 90px var(--pink);animation:pop .6s ease-out}
@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
#win .h{font-size:clamp(8px,1.4vw,16px);color:var(--cyan);text-shadow:0 0 10px var(--cyan);margin-top:1vh}
#absent{margin-top:2vh;font-size:clamp(8px,1.2vw,14px);padding:1.5vh 1.6vw;border-radius:10px;border:3px solid var(--red);background:rgba(120,0,40,.55);color:#fff}
canvas#fx{position:fixed;inset:0;z-index:80;pointer-events:none}

/* ---------- modals ---------- */
.modal{position:fixed;inset:0;z-index:75;background:rgba(5,0,15,.92);display:none;align-items:center;justify-content:center;padding:3vh 3vw}
.modal.open{display:flex}
#conn{z-index:76}
.box{width:min(780px,100%);max-height:100%;display:flex;flex-direction:column;gap:1.4vh;border:5px solid var(--cyan);border-radius:16px;background:#12033a;box-shadow:0 0 40px var(--cyan);padding:2.2vh 2.2vw}
.box.big{height:min(95vh,920px)}
.box h3{margin:0;font-size:clamp(12px,2vw,20px);color:var(--pink);text-shadow:0 0 10px var(--pink);text-align:center}
.box p{margin:0;font-family:'VT323',monospace;font-size:clamp(18px,2.2vw,26px);color:#cfc6f5;text-align:center}
.in,textarea{user-select:text;background:#05010f;color:var(--green);border:3px solid var(--green);border-radius:8px;
  font-family:'VT323',monospace;font-size:clamp(20px,2.4vw,28px);padding:1vh 1vw;outline:none;width:100%}
textarea{resize:none}
.addrow{display:flex;gap:1vw;align-items:stretch}
.addrow textarea{flex:1;height:11vh}
.nlist{flex:1;min-height:0;overflow:auto;border:3px solid var(--green);border-radius:8px;background:#05010f}
.nrow{display:flex;align-items:center;gap:1vw;padding:.5vh 1vw;border-bottom:1px dashed #3a2a7a;font-family:'VT323',monospace;font-size:clamp(20px,2.4vw,28px)}
.nrow .i{color:var(--pink);min-width:2.2em}
.nrow .nm{flex:1;color:var(--green);text-shadow:0 0 6px var(--green);word-break:break-word}
.nrow.won .nm{color:var(--yellow);text-shadow:0 0 6px var(--yellow)}
.del{font-family:'Press Start 2P',monospace;font-size:clamp(8px,1.1vw,12px);padding:1.1vh .9vw;border-radius:8px;border:2px solid var(--red);background:transparent;color:var(--red);min-width:6.5em}
.del.sure{background:var(--red);color:#fff}
.mmsg{min-height:1.2em}
.row{display:flex;gap:1.2vw;flex-wrap:wrap;justify-content:center;align-items:center}
.mbtn{font-size:clamp(9px,1.4vw,15px);padding:1.6vh 1.6vw;border-radius:10px;border:3px solid #fff}
.ok{background:var(--pink);box-shadow:0 0 16px var(--pink)}
.alt{background:#3a1a8a;box-shadow:0 0 16px #6a3fff}
.warn{background:#a10030;box-shadow:0 0 16px #ff1a5c}

/* portrait tablets */
@media (orientation:portrait){
  .cabinet{flex-direction:column;gap:1vh}
  .lever{display:none}
  aside{width:100%;flex-direction:row;flex-wrap:wrap;justify-content:center;gap:1vh 2vw}
  aside .panel{flex:1 1 40%}
  .hof{max-height:16vh}
  .symrow{height:14vh}.symwrap{width:17vh}
}
</style>
</head>
<body>
<div class="bg"><div class="stars"></div><div class="sun"></div><div class="floor"></div></div>
<canvas id="fx"></canvas>

<main>
  <h1>SMK LUNDU <span>ANNUAL DINNER</span></h1>
  <div class="sub">★ INSERT COIN · LUCKY DRAW ★</div>

  <div class="cabinet">
    <div class="machine" id="machine">
      <div class="marquee">
        <div class="bulbs" id="bulbsTop"></div>
        <div class="mq">★ LUCKY DRAW JACKPOT ★</div>
        <div class="bulbs" id="bulbsBot"></div>
      </div>

      <div class="symrow">
        <div class="symwrap"><div class="reelwin" id="sym0"><div class="glass"></div></div></div>
        <div class="symwrap"><div class="reelwin" id="sym1"><div class="glass"></div></div></div>
        <div class="symwrap"><div class="reelwin" id="sym2"><div class="glass"></div></div></div>
      </div>

      <div class="namewrap">
        <div class="arrow l">▶</div><div class="arrow r">◀</div>
        <div class="reelwin" id="nameWin"><div class="glass"></div></div>
      </div>

      <div class="lcd" id="label">CONNECTING...</div>
      <button id="start" class="btn" disabled>▶ Pull the Lever</button>
    </div>

    <div class="lever" id="lever" title="Pull!">
      <div class="rail"></div><div class="ball"></div><div class="pulltxt">PULL!</div>
    </div>

    <aside>
      <div class="panel"><h2>PLAYERS LEFT</h2><div class="count" id="left">0</div></div>
      <div class="panel hof"><h2>HALL OF FAME</h2><ol id="list"></ol></div>
      <div class="tools">
        <button class="btn tool" id="gear">⚙ NAMES</button>
        <button class="btn tool" id="snd">🔊 ON</button>
        <button class="btn tool" id="mus">🎵 ON</button>
        <button class="btn tool" id="mymus">🎧 MY MUSIC</button>
        <button class="btn tool" id="fs">⛶</button>
        <input type="file" id="musfile" accept="audio/*" hidden>
      </div>
      <div class="sync" id="sync">☁ ...</div>
    </aside>
  </div>
</main>

<div id="win">
  <div class="t">★ JACKPOT · WE HAVE A WINNER ★</div>
  <div class="n" id="winName"></div>
  <div class="h">TAP ANYWHERE TO CONTINUE</div>
  <button class="btn" id="absent">✖ ABSENT? DELETE &amp; REDRAW</button>
</div>
<div class="scan"></div>

<!-- Manage names -->
<div class="modal" id="modal">
  <div class="box big">
    <h3>⚙ MANAGE NAMES</h3>
    <p id="cnt"></p>
    <div class="addrow">
      <textarea id="addTa" spellcheck="false" autocapitalize="words" placeholder="Add names (one per line)"></textarea>
      <button class="btn mbtn ok" id="addBtn">+ ADD</button>
    </div>
    <input class="in" id="filter" placeholder="Search name..." autocomplete="off">
    <div class="nlist" id="nameList"></div>
    <p class="mmsg" id="mmsg"></p>
    <div class="row">
      <button class="btn mbtn alt" id="syncBtn">↻ REFRESH</button>
      <button class="btn mbtn warn" id="reset">RESET WINNERS</button>
      <button class="btn mbtn alt" id="connBtn">☁ CONNECTION</button>
      <button class="btn mbtn ok" id="close">DONE</button>
    </div>
  </div>
</div>

<!-- Connection -->
<div class="modal" id="conn">
  <div class="box">
    <h3>☁ CONNECT TO GOOGLE SHEET</h3>
    <p id="cmsg"></p>
    <input class="in" id="cUrl" placeholder="Web app URL (https://script.google.com/.../exec)" autocomplete="off">
    <input class="in" id="cPin" type="password" placeholder="PIN" autocomplete="off">
    <div class="row">
      <button class="btn mbtn ok" id="cSave">CONNECT</button>
      <button class="btn mbtn alt" id="cClose">CLOSE</button>
    </div>
  </div>
</div>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const sleep = ms => new Promise(r => setTimeout(r, ms));

  /* =====================================================================
     CONFIG – paste your Google Apps Script "Web app" URL between the quotes.
     (Or leave it empty and type it in the app's ☁ CONNECTION screen.)
     ===================================================================== */
  const API_URL = 'https://script.google.com/macros/s/AKfycbyJN378EYQNWwwrKR9JwU7awdldP8h-l-u0cpCaKbhBwIhV7fGNlg4G6tLIzfl0uSLN/exec';

  const CFG_KEY = 'smklundu.cfg.v1', PREF_KEY = 'smklundu.prefs.v1';
  let cfg = { url: API_URL, pin: '' };
  try { const c = JSON.parse(localStorage.getItem(CFG_KEY)); if (c){ if (!API_URL && c.url) cfg.url = c.url; if (c.pin) cfg.pin = c.pin; } } catch(e){}

  // local preferences only (sound / music) – names & winners live in Google Sheet
  let state = { sound: true, music: true };
  try { Object.assign(state, JSON.parse(localStorage.getItem(PREF_KEY) || '{}')); } catch(e){}
  const savePrefs = () => { try { localStorage.setItem(PREF_KEY, JSON.stringify(state)); } catch(e){} };

  // data from Google Sheet
  let names = [], winners = [], unsaved = null, lastWin = null;
  const wonIds = () => new Set(winners.map(w => w.id));
  const pool = () => { const s = wonIds(); return names.filter(n => !s.has(n.id)); };

  function rnd(n){ const max = Math.floor(0xFFFFFFFF / n) * n, a = new Uint32Array(1);
    do { crypto.getRandomValues(a); } while (a[0] >= max); return a[0] % n; }

  /* ---------- Google Sheet API ---------- */
  async function api(action, data){
    const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 25000);
    try {
      const r = await fetch(cfg.url, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },   // avoids CORS pre-flight
        body: JSON.stringify(Object.assign({ action: action, pin: cfg.pin }, data || {})),
        signal: ctl.signal
      });
      const j = await r.json();
      if (!j.ok){ const e = new Error(j.error || 'SERVER ERROR'); e.code = j.error || 'SERVER_ERROR'; throw e; }
      return j;
    } finally { clearTimeout(to); }
  }

  let busy = 0, online = true, lastSync = null;
  function setSync(){
    const el = $('sync'); el.className = 'sync';
    if (unsaved){ el.textContent = '⚠ LAST WINNER NOT SAVED – TAP TO RETRY'; el.classList.add('bad'); }
    else if (busy){ el.textContent = '☁ SAVING...'; }
    else if (!online){ el.textContent = '✖ OFFLINE – TAP TO RETRY'; el.classList.add('bad'); }
    else if (lastSync){ el.textContent = '☁ SYNCED ' + lastSync.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}); }
    else el.textContent = '☁ ...';
  }
  function applyState(j){
    names = j.names || []; winners = j.winners || [];
    if (unsaved && !winners.some(w => w.id === unsaved.id)) winners.push(unsaved);
    online = true; lastSync = new Date();
    render(); renderManage();
  }
  async function call(action, data){
    busy++; setSync();
    try { const j = await api(action, data); applyState(j); return j; }
    catch(e){
      if (e.code === 'WRONG_PIN') openConn('WRONG PIN – TRY AGAIN');
      else if (!e.code) online = false;
      throw e;
    } finally { busy--; setSync(); }
  }
  const refresh = () => (spinning || !cfg.url || !cfg.pin) ? Promise.resolve() : call('state').then(() => updateStart(false)).catch(()=>{});

  /* ---------- sound effects ---------- */
  let ac;
  function tone(freq, dur, when=0, type='square', vol=.1){
    if (!state.sound) return;
    try {
      ac = ac || new (window.AudioContext||window.webkitAudioContext)();
      if (ac.state === 'suspended') ac.resume();
      const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + when;
      o.type = type; o.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
      o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + dur + .02);
    } catch(e){}
  }
  const tick = () => tone(700 + Math.random()*200, .03, 0, 'square', .06);
  const clunk = () => { tone(150,.14,0,'square',.16); tone(95,.2,.02,'triangle',.18); };
  const coin = () => { tone(988,.08); tone(1319,.35,.08); };
  function fanfare(){
    [523,659,784,1047,784,1047,1319,1568].forEach((f,i)=>tone(f,.16,i*.11,'square',.14));
    [262,330,392,523].forEach((f,i)=>tone(f,.5,i*.22,'triangle',.12));
    tone(1568,.7,.9,'square',.14);
    for (let i=0;i<14;i++) tone(1900 + (i%3)*250, .05, .9 + i*.07, 'square', .08);
  }

  /* ---------- 80s synthwave music (original, generated live) ---------- */
  const Music = (() => {
    const BPM = 118, SP = 60 / BPM / 4;
    const bass = [110, 87.31, 130.81, 98];
    const chords = [[220,261.63,329.63],[174.61,220,261.63],[261.63,329.63,392],[196,246.94,293.66]];
    const lead = [
      [659,0,0,659,0,523,0,587, 659,0,0,0,880,0,784,0],
      [698,0,0,698,0,587,0,523, 698,0,0,0,880,0,698,0],
      [784,0,0,784,0,659,0,523, 784,0,0,0,1047,0,880,0],
      [587,0,0,587,0,494,0,587, 784,0,0,0,988,0,784,0]
    ];
    let master, noise, timer = null, step = 0, nextT = 0, intensity = 0, playing = false, el = null, url = null;
    function init(){
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state === 'suspended') ac.resume();
      if (!master){
        master = ac.createGain(); master.gain.value = .5; master.connect(ac.destination);
        noise = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
        const d = noise.getChannelData(0); for (let i=0;i<d.length;i++) d[i] = Math.random()*2-1;
      }
    }
    function osc(type, f, t, dur, vol, lp){
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0008, t + dur);
      if (lp){ const fl = ac.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = lp; o.connect(fl); fl.connect(g); }
      else o.connect(g);
      g.connect(master); o.start(t); o.stop(t + dur + .02);
    }
    function nz(t, dur, vol, type, freq){
      const s = ac.createBufferSource(); s.buffer = noise;
      const f = ac.createBiquadFilter(); f.type = type; f.frequency.value = freq;
      const g = ac.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0008, t + dur);
      s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + dur + .02);
    }
    function kick(t, vol){
      const o = ac.createOscillator(), g = ac.createGain();
      o.frequency.setValueAtTime(160, t); o.frequency.exponentialRampToValueAtTime(45, t + .12);
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + .18);
      o.connect(g); g.connect(master); o.start(t); o.stop(t + .2);
    }
    function sched(i, t){
      const bar = Math.floor(i/16) % 4, s = i % 16, ch = chords[bar];
      if (s % 2 === 0) osc('sawtooth', bass[bar] * (s % 4 === 2 ? 2 : 1), t, SP*1.8, .13, 700);
      osc('square', ch[[0,1,2,1][s % 4]] * (s % 8 < 4 ? 1 : 2), t, SP*.9, .035, 2200);
      if (s === 0) ch.forEach(f => osc('triangle', f, t, SP*15, .045));
      if (intensity){
        if (s % 4 === 0) kick(t, .5);
        if (s === 4 || s === 12){ nz(t, .14, .22, 'bandpass', 1800); osc('triangle', 190, t, .08, .12); }
        if (s % 2 === 0) nz(t, .04, .07, 'highpass', 7000);
        const f = lead[bar][s]; if (f) osc('square', f, t, SP*1.8, .05, 3500);
      } else {
        if (s % 8 === 0) kick(t, .28);
        if (s % 4 === 2) nz(t, .03, .035, 'highpass', 7000);
      }
    }
    function pump(){ while (nextT < ac.currentTime + .15){ sched(step, nextT); nextT += SP; step++; } }
    return {
      isPlaying: () => playing,
      hasCustom: () => !!el,
      start(){
        if (playing) return;
        if (el){ el.play().catch(()=>{}); playing = true; return; }
        init(); playing = true; step = 0; nextT = ac.currentTime + .05; timer = setInterval(pump, 25);
      },
      stop(){ playing = false; clearInterval(timer); timer = null; if (el) el.pause(); },
      setIntensity(v){ intensity = v; if (el) el.volume = v ? .9 : .5; },
      duck(ms){
        if (el){ el.volume = .15; setTimeout(()=>{ el.volume = intensity ? .9 : .5; }, ms); return; }
        if (!master) return;
        master.gain.setTargetAtTime(.1, ac.currentTime, .05);
        setTimeout(()=> master.gain.setTargetAtTime(.5, ac.currentTime, .4), ms);
      },
      setCustom(file){
        const was = playing; this.stop();
        if (url) URL.revokeObjectURL(url);
        url = URL.createObjectURL(file); el = new Audio(url); el.loop = true; el.volume = intensity ? .9 : .5;
        if (was || state.music) this.start();
      },
      clearCustom(){
        const was = playing; this.stop();
        if (el){ el.pause(); el = null; } if (url){ URL.revokeObjectURL(url); url = null; }
        if (was && state.music) this.start();
      }
    };
  })();

  /* ---------- slot reels ---------- */
  const SYMS = ['🍒','🔔','⭐','💎','BAR','7'];
  const IDLE_SYMS = ['🍒','🔔','💎'];

  function makeReel(win, kind){
    const strip = document.createElement('div'); strip.className = 'strip';
    win.insertBefore(strip, win.firstChild);
    return { win, strip, kind, rh: 0, k: 0, items: ['', '', ''] };
  }
  function setItems(r, items){
    r.items = items; r.strip.innerHTML = '';
    if (!r.rh) return;
    r.strip.style.setProperty('--rh', r.rh + 'px');
    const W = r.win.clientWidth;
    items.forEach(t => {
      const d = document.createElement('div'); d.className = 'cell'; d.textContent = t;
      if (r.kind === 'sym'){
        d.classList.add('sym');
        if (t === '7') d.classList.add('seven');
        if (t === 'BAR') d.classList.add('bar');
        d.style.fontSize = (t === 'BAR' ? r.rh * .34 : t === '7' ? r.rh * .5 : r.rh * .6) + 'px';
      } else {
        d.style.fontSize = Math.min(r.rh * .72, (W * .9) / (Math.max(t.length, 3) * .42)) + 'px';
      }
      r.strip.appendChild(d);
    });
  }
  const place = (r, k) => { r.k = k; r.strip.style.transform = `translateY(${-k * r.rh}px)`; };

  function animate(r, k0, k1, dur, onRow, done){
    const t0 = performance.now(); let lastRow = -1, prevK = k0;
    (function f(now){
      const p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 4);
      const k = k0 + (k1 - k0) * e; place(r, k);
      const speed = (k - prevK) * r.rh; prevK = k;
      r.win.style.filter = speed > 30 ? `blur(${Math.min(3, speed / 22)}px)` : 'none';
      const row = Math.floor(k); if (row !== lastRow){ lastRow = row; onRow && onRow(row); }
      if (p < 1) requestAnimationFrame(f); else { r.win.style.filter = 'none'; done && done(); }
    })(t0);
  }

  const mainReel = makeReel($('nameWin'), 'name');
  const symReels = [0,1,2].map(i => makeReel($('sym' + i), 'sym'));
  const allReels = [mainReel, ...symReels];
  let spinning = false, shown = '? ? ?';

  function showIdle(){
    setItems(mainReel, ['', shown, '']); place(mainReel, 0);
    symReels.forEach((r,i)=>{ setItems(r, ['', (r.items[1] || IDLE_SYMS[i]), '']); place(r, 0); });
  }
  function layout(){
    allReels.forEach(r => { const h = r.win.clientHeight; if (h) r.rh = h / 3; });
    if (!spinning) showIdle();
    else allReels.forEach(r => r.strip.style.setProperty('--rh', r.rh + 'px'));
  }
  const ro = new ResizeObserver(layout); allReels.forEach(r => ro.observe(r.win));

  ['bulbsTop','bulbsBot'].forEach(id => { const el = $(id); for (let i=0;i<26;i++) el.appendChild(document.createElement('span')); });

  /* ---------- UI ---------- */
  const label = $('label'), startBtn = $('start'), machine = $('machine'), lever = $('lever');

  function updateStart(resetLabel){
    if (spinning) return;
    const left = pool().length;
    startBtn.disabled = !left;
    startBtn.textContent = !names.length ? 'ADD NAMES FIRST' : !left ? 'GAME OVER' : (winners.length ? '▶ Pull Again' : '▶ Pull the Lever');
    if (resetLabel) label.textContent = !names.length ? 'NO NAMES · OPEN ⚙ NAMES' : !left ? 'GAME OVER · ALL NAMES DRAWN' : 'PLAYER 1 READY';
  }
  function render(){
    $('left').textContent = pool().length;
    const ol = $('list'); ol.innerHTML = '';
    winners.forEach((w,i)=>{
      const li = document.createElement('li'), b = document.createElement('b'), sp = document.createElement('span');
      b.textContent = String(i+1).padStart(2,'0'); sp.textContent = w.name; li.append(b,sp); ol.prepend(li);
    });
    $('snd').textContent = state.sound ? '🔊 ON' : '🔇 OFF';
    $('mus').textContent = state.music ? '🎵 ON' : '🎵 OFF';
    $('mymus').textContent = Music.hasCustom() ? '🎧 BUILT-IN' : '🎧 MY MUSIC';
    updateStart(false);
  }
  function idle(){ shown = '? ? ?'; showIdle(); updateStart(true); }
  function pullLever(){
    lever.classList.remove('pull'); void lever.offsetWidth; lever.classList.add('pull');
    setTimeout(()=> lever.classList.remove('pull'), 1000);
  }

  // two-tap confirm for risky buttons
  function arm(btn, armedText){
    if (btn.dataset.armed){ clearTimeout(btn._t); delete btn.dataset.armed; btn.classList.remove('sure'); btn.textContent = btn.dataset.orig; return true; }
    btn.dataset.orig = btn.textContent; btn.dataset.armed = '1'; btn.classList.add('sure'); btn.textContent = armedText;
    btn._t = setTimeout(()=>{ delete btn.dataset.armed; btn.classList.remove('sure'); btn.textContent = btn.dataset.orig; }, 3000);
    return false;
  }

  /* ---------- spin ---------- */
  function spin(){
    if (spinning) return;
    if (!cfg.url || !cfg.pin){ openConn('ENTER URL + PIN'); return; }
    if (unsaved){ label.textContent = '⚠ SAVING LAST WINNER...'; retryUnsaved(); return; }
    const p = pool();
    if (!p.length){ updateStart(true); return; }
    spinning = true; startBtn.disabled = true; startBtn.textContent = 'SPINNING...';
    machine.classList.remove('jackpot'); machine.classList.add('spinning');
    label.textContent = 'GOOD LUCK!'; coin(); pullLever(); Music.setIntensity(1);

    const win = p[rnd(p.length)];                                   // fair secure pick, decided up-front
    // save to Google Sheet in the background while the reels spin (not shown until the reels stop)
    const saving = api('recordWinner', { id: win.id }).then(j => ({ ok: true, j }), e => ({ ok: false, e }));
    const pn = p.map(x => x.name), D = 7600;

    const N = 56 + rnd(14); const items = ['', shown]; let prev = shown;
    for (let i=0;i<N;i++){
      let t, g = 0;
      do { t = pn[rnd(pn.length)]; g++; } while (pn.length > 1 && g < 10 && (t === prev || (i === N-1 && t === win.name)));
      items.push(t); prev = t;
    }
    items.push(win.name);
    items.push(pn[rnd(pn.length)]);
    const W = items.length - 2;
    setItems(mainReel, items); place(mainReel, 0);
    animate(mainReel, 0, W - 1, D, () => tick(), () => finish(win, W, saving));

    symReels.forEach((r, j) => {
      const cur = r.items[1] || IDLE_SYMS[j];
      const its = ['', cur]; const M = 24 + j*8 + rnd(5);
      for (let i=0;i<M;i++) its.push(SYMS[rnd(SYMS.length)]);
      its.push('7'); its.push(SYMS[rnd(SYMS.length)]);
      setItems(r, its); place(r, 0);
      animate(r, 0, its.length - 3, D - 1700 + j*600, null, () => clunk());
    });
  }

  async function finish(win, W, saving){
    lastWin = win; shown = win.name;
    const cell = mainReel.strip.children[W]; if (cell) cell.classList.add('winner');
    machine.classList.remove('spinning'); machine.classList.add('jackpot');
    label.textContent = '★ ★ ★  JACKPOT  ★ ★ ★';
    Music.setIntensity(0); Music.duck(5500);
    fanfare(); confetti();
    setTimeout(()=>{ $('winName').textContent = win.name; $('win').classList.add('open'); }, 1800);

    let res = await saving;
    if (res.ok){ applyState(res.j); }
    else {
      for (let i=0;i<3 && !res.ok;i++){
        await sleep(1500);
        try { await call('recordWinner', { id: win.id }); res.ok = true; } catch(e){ if (e.code === 'WRONG_PIN') break; }
      }
      if (!res.ok){
        unsaved = { order: winners.length + 1, id: win.id, name: win.name, time: '' };
        winners.push(unsaved); render();
      }
    }
    spinning = false; setSync(); updateStart(false);
  }
  async function retryUnsaved(){
    if (!unsaved) return;
    try { await call('recordWinner', { id: unsaved.id }); unsaved = null; label.textContent = 'SAVED ✔'; }
    catch(e){ label.textContent = '⚠ STILL NOT SAVED – CHECK INTERNET'; }
    setSync(); updateStart(false);
  }

  function closeWin(){
    $('win').classList.remove('open'); machine.classList.remove('jackpot');
    setItems(mainReel, ['', shown, '']); place(mainReel, 0);
    if (!spinning) updateStart(true);
  }
  $('win').addEventListener('click', closeWin);
  $('absent').addEventListener('click', async e => {
    e.stopPropagation();
    if (!arm($('absent'), 'TAP AGAIN TO CONFIRM')) return;
    const id = lastWin && lastWin.id; if (!id) return;
    if (unsaved && unsaved.id === id) unsaved = null;
    $('win').classList.remove('open'); machine.classList.remove('jackpot');
    shown = '? ? ?'; showIdle(); label.textContent = 'REMOVING ABSENT WINNER...';
    try { await call('absent', { id }); label.textContent = 'REDRAW! PULL THE LEVER'; }
    catch(err){ label.textContent = '⚠ COULD NOT UPDATE SHEET – OPEN ⚙ NAMES'; }
    updateStart(false);
  });

  startBtn.addEventListener('click', spin);
  lever.addEventListener('click', spin);
  $('sync').addEventListener('click', () => unsaved ? retryUnsaved() : refresh());
  document.addEventListener('keydown', e=>{
    const anyModal = document.querySelector('.modal.open');
    if ((e.code==='Space'||e.code==='Enter') && !anyModal && !$('win').classList.contains('open')){ e.preventDefault(); spin(); }
  });
  document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });

  /* ---------- confetti ---------- */
  const fx = $('fx'), fc = fx.getContext('2d'); let parts = [], raf;
  const fxSize = () => { fx.width = innerWidth; fx.height = innerHeight; };
  addEventListener('resize', fxSize); fxSize();
  function confetti(){
    const cols = ['#ff2bd6','#27f3ff','#fff200','#39ff14','#ff7a18','#ffffff'];
    for (let k=0;k<2;k++) for (let i=0;i<150;i++){
      parts.push({x: fx.width*(k?0.85:0.15), y: fx.height*.8, vx:(k?-1:1)*(Math.random()*10+2)+(Math.random()-.5)*6, vy:-Math.random()*24-6,
        s:6+Math.random()*10, c:cols[(Math.random()*cols.length)|0], life:160+Math.random()*100});
    }
    cancelAnimationFrame(raf); loop();
  }
  function loop(){
    fc.clearRect(0,0,fx.width,fx.height);
    parts.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=.5; p.vx*=.99; p.life--;
      fc.fillStyle=p.c; fc.globalAlpha=Math.max(0,Math.min(1,p.life/40)); fc.fillRect(p.x,p.y,p.s,p.s); });
    fc.globalAlpha = 1; parts = parts.filter(p=>p.life>0 && p.y<fx.height+40);
    if (parts.length) raf = requestAnimationFrame(loop); else fc.clearRect(0,0,fx.width,fx.height);
  }

  /* ---------- manage names ---------- */
  const modal = $('modal'), listEl = $('nameList');
  const mmsg = (t, bad) => { const m = $('mmsg'); m.textContent = t || ''; m.style.color = bad ? '#ff6b8f' : '#cfc6f5'; };
  const errText = e => e.code === 'WRONG_PIN' ? 'WRONG PIN' : (e.code ? 'ERROR: ' + e.code : 'NO CONNECTION – TRY AGAIN');

  function renderManage(){
    if (!modal.classList.contains('open')) return;
    const q = $('filter').value.trim().toLowerCase(), won = wonIds(), top = listEl.scrollTop;
    listEl.innerHTML = '';
    names.forEach((n, i) => {
      if (q && !n.name.toLowerCase().includes(q)) return;
      const row = document.createElement('div'); row.className = 'nrow' + (won.has(n.id) ? ' won' : '');
      const idx = document.createElement('span'); idx.className = 'i'; idx.textContent = String(i+1).padStart(2,'0');
      const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = n.name + (won.has(n.id) ? '  ★ WON' : '');
      const del = document.createElement('button'); del.className = 'btn del'; del.textContent = 'DELETE';
      del.onclick = async () => {
        if (!arm(del, 'SURE?')) return;
        mmsg('Deleting...');
        try { await call('deleteName', { id: n.id }); mmsg('Deleted ' + n.name); updateStart(true); }
        catch(e){ mmsg(errText(e), true); }
      };
      row.append(idx, nm, del); listEl.appendChild(row);
    });
    listEl.scrollTop = top;
    $('cnt').textContent = names.length + ' NAMES · ' + winners.length + ' WON · ' + pool().length + ' LEFT';
  }
  $('gear').onclick = () => { if (spinning) return; modal.classList.add('open'); mmsg(''); renderManage(); };
  $('close').onclick = () => { modal.classList.remove('open'); if (!spinning){ shown = shown; updateStart(true); } };
  $('filter').addEventListener('input', renderManage);
  $('addBtn').onclick = async () => {
    const arr = $('addTa').value.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
    if (!arr.length) return;
    mmsg('Adding...');
    try { await call('addNames', { names: arr }); $('addTa').value = ''; mmsg('Added ' + arr.length + ' name(s) ✔'); listEl.scrollTop = listEl.scrollHeight; }
    catch(e){ mmsg(errText(e), true); }
  };
  $('syncBtn').onclick = async () => { mmsg('Refreshing...'); try { await call('state'); mmsg('Up to date ✔'); } catch(e){ mmsg(errText(e), true); } };
  $('reset').onclick = async () => {
    if (!confirm('Clear ALL winners and start the draw again?\n(The names stay in the list.)')) return;
    mmsg('Resetting...');
    try { await call('resetWinners'); unsaved = null; shown = '? ? ?'; showIdle(); mmsg('All winners cleared ✔'); updateStart(true); setSync(); }
    catch(e){ mmsg(errText(e), true); }
  };
  $('connBtn').onclick = () => openConn('');

  /* ---------- connection ---------- */
  function openConn(msg){
    $('cUrl').value = cfg.url || ''; $('cUrl').disabled = !!API_URL;
    $('cPin').value = ''; $('cmsg').textContent = msg || '';
    $('conn').classList.add('open');
  }
  $('cClose').onclick = () => $('conn').classList.remove('open');
  $('cSave').onclick = async () => {
    const url = $('cUrl').value.trim(), pin = $('cPin').value.trim();
    if (!url || !pin){ $('cmsg').textContent = 'FILL IN BOTH FIELDS'; return; }
    cfg.url = API_URL || url; cfg.pin = pin; $('cmsg').textContent = 'CONNECTING...';
    try {
      await call('state');
      try { localStorage.setItem(CFG_KEY, JSON.stringify({ url: cfg.url, pin: cfg.pin })); } catch(e){}
      $('conn').classList.remove('open'); idle();
    } catch(e){ $('cmsg').textContent = e.code === 'WRONG_PIN' ? 'WRONG PIN' : '⚠ CAN\'T REACH SHEET – CHECK URL / INTERNET'; }
  };
  $('cPin').addEventListener('keydown', e => { if (e.key === 'Enter') $('cSave').click(); });

  /* ---------- sound / music / fullscreen ---------- */
  $('snd').onclick = () => { state.sound = !state.sound; savePrefs(); render(); if (state.sound) coin(); };
  $('fs').onclick = () => { const d = document, e = d.documentElement;
    if (!d.fullscreenElement) (e.requestFullscreen || e.webkitRequestFullscreen || function(){}).call(e);
    else (d.exitFullscreen || d.webkitExitFullscreen || function(){}).call(d); };
  $('mus').onclick = () => { state.music = !state.music; savePrefs(); render(); state.music ? Music.start() : Music.stop(); };
  $('mymus').onclick = () => { if (Music.hasCustom()){ Music.clearCustom(); render(); } else $('musfile').click(); };
  $('musfile').onchange = e => {
    const f = e.target.files && e.target.files[0]; if (!f) return;
    state.music = true; savePrefs(); Music.setCustom(f); render(); e.target.value = '';
  };
  document.addEventListener('pointerdown', () => { if (state.music && !Music.isPlaying()) Music.start(); }, { once: true });

  /* ---------- start ---------- */
  async function boot(){
    render(); setSync();
    if (!cfg.url || !cfg.pin){ label.textContent = 'NOT CONNECTED'; openConn(cfg.url ? 'ENTER PIN' : 'ENTER GOOGLE SHEET URL + PIN'); return; }
    label.textContent = 'CONNECTING TO GOOGLE SHEET...';
    try { await call('state'); idle(); }
    catch(e){ label.textContent = e.code === 'WRONG_PIN' ? '⚠ WRONG PIN' : '⚠ CAN\'T REACH GOOGLE SHEET · TAP ☁ TO RETRY'; }
  }
  layout(); boot();
})();
</script>
</body>
